name: Build TianXuanDev APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional Release Tag (e.g. v0.2.1-dev)'
        required: false
        default: ''

jobs:
  build:
    name: Build & Package TianXuanDev
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDKs (17 for compile toolchain, 25 for Gradle daemon)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          # Gradle daemon 由 gradle/gradle-daemon-jvm.properties 固定 toolchainVersion=25，
          # 而工程编译 toolchain 走 jvmToolchain(17)/VERSION_17。两者都必须在 runner 上存在，
          # 否则 daemon 启动即报 "Cannot find a Java installation ... languageVersion=25"。
          java-version: |
            17
            25
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 'tools' 包已于 2026-09 被 Google 下线，不能再用默认值（tools platform-tools）
          # 参考 https://github.com/android-actions/setup-android/issues/537
          packages: 'platform-tools'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build TianXuanDev APK
        env:
          TIANXUAN_DEV_BUILD: "1"
        run: |
          # gradle.properties 里 org.gradle.java.installations.paths 固定的是沙盒机的本地路径
          # (/usr/lib/jvm/java-17-openjdk-amd64 等)，在 GitHub runner 上并不存在，且 auto-detect=false，
          # 导致 Gradle daemon (toolchainVersion=25) 与编译 toolchain(17) 都找不到 JDK。
          # 这里用 setup-java 导出的 JAVA_HOME_*_X64 覆盖安装路径，指向 runner 上真实的 JDK。
          ./gradlew assembleDebug --no-daemon --stacktrace \
            -Dorg.gradle.java.installations.auto-detect=false \
            -Dorg.gradle.java.installations.auto-download=false \
            -Dorg.gradle.java.installations.paths="${JAVA_HOME_17_X64},${JAVA_HOME_25_X64}" 

      - name: Identify and Rename Output APK
        run: |
          mkdir -p output
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" output/TianXuanDev-arm64-debug.apk
            sha256sum output/TianXuanDev-arm64-debug.apk > output/TianXuanDev-arm64-debug.apk.sha256
            echo "APK ready: output/TianXuanDev-arm64-debug.apk"
          else
            echo "Error: No APK generated!" && exit 1
          fi

      - name: Upload TianXuanDev APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tianxuandev-apk
          path: output/*
          retention-days: 7

      - name: Create GitHub Release (Optional)
        if: "${{ github.event.inputs.release_tag != '' }}"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ github.event.inputs.release_tag }}"
          name: "TianXuanDev Preview ${{ github.event.inputs.release_tag }}"
          files: output/*
          draft: false
          prerelease: true
