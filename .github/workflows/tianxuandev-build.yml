name: Build CTHarnessDev APK

on:
  push:
    branches:
      - feat/ctharness-vi
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Thẻ phát hành tuỳ chọn (ví dụ v0.2.1-dev)'
        required: false
        default: ''

jobs:
  build:
    name: Build & Package CTHarnessDev
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # Gradle 9.7 daemon yêu cầu Java 25 qua gradle-daemon-jvm.properties;
      # các module ứng dụng vẫn biên dịch bằng toolchain Java 17.
      - name: Set up JDK 25 for the Gradle daemon
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Gói 'tools' đã bị Google ngừng cung cấp từ 2026-09, không thể dùng giá trị mặc định (tools platform-tools) nữa
          # Tham khảo https://github.com/android-actions/setup-android/issues/537
          packages: 'platform-tools'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # Chữ ký cố định: decode keystore từ Secrets để mọi build cùng chữ ký,
      # tránh INSTALL_FAILED_UPDATE_INCOMPATIBLE khi cài đè bản cũ.
      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.TIANXUAN_RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ctharness-release.jks"
          test -s "$RUNNER_TEMP/ctharness-release.jks"

      - name: Build CTHarnessDev APK
        env:
          TIANXUAN_DEV_BUILD: "1"
          TIANXUAN_RELEASE_STORE_FILE: ${{ runner.temp }}/ctharness-release.jks
          TIANXUAN_RELEASE_STORE_PASSWORD: ${{ secrets.TIANXUAN_RELEASE_STORE_PASSWORD }}
          TIANXUAN_RELEASE_KEY_ALIAS: ${{ secrets.TIANXUAN_RELEASE_KEY_ALIAS }}
          TIANXUAN_RELEASE_KEY_PASSWORD: ${{ secrets.TIANXUAN_RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace \
            -Porg.gradle.java.installations.paths="$JAVA_HOME_17_X64,$JAVA_HOME_25_X64" \
            -Porg.gradle.java.installations.auto-detect=true

      - name: Identify and Rename Output APK
        run: |
          mkdir -p output
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" output/CTHarnessDev-arm64-debug.apk
            sha256sum output/CTHarnessDev-arm64-debug.apk > output/CTHarnessDev-arm64-debug.apk.sha256
            echo "APK ready: output/CTHarnessDev-arm64-debug.apk"
          else
            echo "Error: No APK generated!" && exit 1
          fi

      - name: Upload CTHarnessDev APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ctharness-apk
          path: output/*
          retention-days: 7

      - name: Create GitHub Release (Optional)
        if: "${{ github.event.inputs.release_tag != '' }}"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ github.event.inputs.release_tag }}"
          name: "CTHarnessDev Preview ${{ github.event.inputs.release_tag }}"
          files: output/*
          draft: false
          prerelease: true
